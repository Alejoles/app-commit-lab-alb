<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="2">
  <title>ALB + ASG Lab · __INSTANCE_ID__</title>
  <style>
    :root { --hue: 200; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, Arial, sans-serif; color: #fff;
           background: hsl(var(--hue) 55% 32%); }
    .card { background: rgba(0,0,0,.55); padding: 28px 44px;
            border-radius: 14px; text-align: center; }
    h1 { margin: 0 0 6px; }
    h2 { margin: 6px 0 16px; color: #FF9900; font-family: monospace; }
    dl { display: grid; grid-template-columns: auto auto; gap: 6px 18px;
         text-align: left; width: fit-content; margin: 0 auto 14px; }
    dt { opacity: .7; }
    dd { margin: 0; font-family: monospace; }
    .seen { font-size: .9rem; opacity: .9; }
  </style>
</head>
<body data-instance="__INSTANCE_ID__">
  <div class="card">
    <h1>Servidor activo</h1>
    <h2>Instance ID: __INSTANCE_ID__</h2>
    <dl>
      <dt>Zona de disponibilidad</dt><dd>__AZ__</dd>
      <dt>IP privada</dt><dd>__PRIVATE_IP__</dd>
      <dt>Tipo de instancia</dt><dd>__INSTANCE_TYPE__</dd>
      <dt>Versión (commit)</dt><dd>__COMMIT__</dd>
      <dt>Hora (navegador)</dt><dd id="t"></dd>
    </dl>
    <div class="seen">Instancias vistas en esta sesión: <b id="n"></b><br><span id="ids"></span></div>
  </div>
  <script>
    const id = document.body.dataset.instance;
    // Color estable por instancia: hash del ID -> matiz
    let h = 0;
    for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360;
    document.documentElement.style.setProperty('--hue', h);
    document.getElementById('t').textContent = new Date().toLocaleTimeString();
    try {
      const seen = new Set(JSON.parse(sessionStorage.getItem('seen') || '[]'));
      seen.add(id);
      sessionStorage.setItem('seen', JSON.stringify([...seen]));
      document.getElementById('n').textContent = seen.size;
      document.getElementById('ids').textContent = [...seen].join(' · ');
    } catch (e) {}
  </script>
</body>
</html>
